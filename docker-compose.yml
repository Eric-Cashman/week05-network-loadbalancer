services:
  loadbalancer:
    image: nginx:1.27-alpine
    container_name: loadbalancer
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
    networks:
      - public_subnet
      - private_subnet

  backend1:
    build: ./backend
    container_name: backend1
    hostname: backend1
    expose:
      - "3000"
    networks:
      - private_subnet

  backend2:
    build: ./backend
    container_name: backend2
    hostname: backend2
    expose:
      - "3000"
    networks:
      - private_subnet

networks:
  public_subnet:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.1.0/24
  private_subnet:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.10.2.0/24